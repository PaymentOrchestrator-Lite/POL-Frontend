<div class="w-full h-full p-4 md:p-8 bg-white shadow-md rounded-lg mx-auto">
  <h2 class="text-xl md:text-2xl font-medium mb-4 text-center">Add New Pending Payment</h2>

  <mat-dialog-content class="mat-typography">
    <form [formGroup]="form" (ngSubmit)="submitForm()" class="space-y-4">

      <!-- User ID / Customer FK -->
      <div class="flex flex-col gap-2">
        <label for="UserFk" class="text-base md:text-lg text-gray-700">Customer ID</label>
        <input id="UserFk" formControlName="UserFk" type="text" required placeholder="Enter customer ID"
          class="input input-bordered w-full rounded-md p-3 md:p-4 border-gray-300 focus:border-purple-500 focus:ring-purple-500 text-base md:text-lg" />
        <div *ngIf="form.controls['UserFk'].touched && form.controls['UserFk'].invalid"
          class="text-red-600 text-sm md:text-base mt-1 md:mt-2">
          <div *ngIf="form.controls['UserFk'].errors?.['required']">Customer ID is required.</div>
        </div>
      </div>

      <!-- Amount -->
      <div class="flex flex-col gap-2">
        <label for="Amount" class="text-base md:text-lg text-gray-700">Amount</label>
        <input id="Amount" formControlName="Amount" type="number" required placeholder="Enter payment amount"
          class="input input-bordered w-full rounded-md p-3 md:p-4 border-gray-300 focus:border-purple-500 focus:ring-purple-500 text-base md:text-lg" />
        <div *ngIf="form.controls['Amount'].touched && form.controls['Amount'].invalid"
          class="text-red-600 text-sm md:text-base mt-1 md:mt-2">
          <div *ngIf="form.controls['Amount'].errors?.['required']">Amount is required.</div>
        </div>
      </div>

    </form>
  </mat-dialog-content>

  <div class="flex flex-col md:flex-row md:justify-end gap-3 pt-4 md:pt-6 mt-4 border-t border-gray-200">

    <button type="button" mat-button mat-dialog-close
      class="btn btn-outline border-gray-400 hover:border-gray-500 text-gray-700 px-4 py-2 rounded-md text-base md:text-lg w-full md:w-auto font-medium">
      Cancel
    </button>

    <button (click)="submitForm()" mat-button [disabled]="!form.valid"
      class="btn btn-primary bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-base md:text-lg w-full md:w-auto font-medium">
      Submit
    </button>

  </div>
</div>
